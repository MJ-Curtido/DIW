<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contacto · RAÍZ</title>
    <link rel="stylesheet" href="/src/tailwind.css" />
  </head>
  <body class="bg-fondo text-texto">
    <!-- ✍️ B3 · Esta página va SOLO con Tailwind (src/tailwind.css), sin SASS. Ponle las clases de utilidad:
         los colores de RAÍZ (del @theme), dos columnas desde md y un botón con hover: y focus-visible:.
         Nada de valores sueltos entre corchetes ni style="". -->
    <header class="flex flex-col bg-marca-suave p-6 md:flex-row md:items-center md:justify-between">
      <a href="/" class="font-bold text-2xl text-marca text-center md:text-left">RAÍZ</a>
      <nav aria-label="Principal" class="flex flex-wrap gap-6 justify-center md:justify-end">
        <a href="/" class="hover:text-marca">Inicio</a>
        <a href="/producto.html" class="hover:text-marca">Monstera</a>
        <a href="/contacto.html" aria-current="page" class="hover:text-marca">Contacto</a>
      </nav>
    </header>

    <main class="mx-auto max-w-6xl px-6 py-12">
      <h1 class="mb-10 text-4xl font-bold text-marca">Contacto</h1>

      <div class="grid grid-cols-1 gap-10 md:grid-cols-2">
        <section aria-label="Dónde estamos" class="rounded-lg border-1 border-marca bg-marca-suave p-8">
          <h2 class="mb-4 text-2xl font-bold text-marca-oscuro">El vivero</h2>
          <p class="mb-6 text-texto">
            Abrimos de lunes a sábado, de 9:00 a 14:00. Si vienes en persona, te ayudamos a elegir.
          </p>
          <p class="font-semibold text-tierra">Envíos gratis desde 40 €</p>
        </section>

        <form action="#" class="flex flex-col gap-6">
          <label for="nombre" class="flex flex-col gap-2 font-medium text-marca-oscuro">
            Nombre
            <input
              id="nombre"
              name="nombre"
              autocomplete="name"
              required
              class="rounded-md border-1 border-marca bg-marca-suave p-3 text-texto"
            />
          </label>
          <label for="correo" class="flex flex-col gap-2 font-medium text-marca-oscuro">
            Correo
            <input
              id="correo"
              name="correo"
              type="email"
              autocomplete="email"
              required
              class="rounded-md border-1 border-marca bg-marca-suave p-3 text-texto"
            />
          </label>
          <label for="mensaje" class="flex flex-col gap-2 font-medium text-marca-oscuro">
            ¿En qué te ayudamos?
            <textarea
              id="mensaje"
              name="mensaje"
              rows="4"
              required
              class="rounded-md border-1 border-marca bg-marca-suave p-3 text-texto"
            ></textarea>
          </label>
          <button
            type="submit"
            class="rounded-md bg-marca py-3 font-semibold text-fondo transition-colors duration-300 hover:bg-marca-oscuro focus-visible:outline-2 focus-visible:outline-marca-oscuro"
          >
            Enviar
          </button>
        </form>
      </div>
    </main>

    <footer class="bg-marca-suave px-6 py-6 text-center text-texto">RAÍZ, vivero online · Cádiz</footer>
  </body>
</html>
